[project]
name = "prisme-crm"
version = "1.0.0"
description = "Prisme — CRM tout-en-un auto-hébergé : ventes, facturation, abonnements, projets, support, marketing, IA multi-fournisseurs et serveur MCP pour Claude."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.30",
    "pyjwt>=2.8",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "anthropic>=1.13",
    "openai>=1.50",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "fpdf2>=2.8.9",
    "factur-x>=7.5",
    "tzdata>=2026.5",
    "markdown>=3.11",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
prisme = "prisme.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prisme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
