# docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# Prometheus :9090 · Alertmanager :9093 · Grafana :3000 (admin / $GRAFANA_PASSWORD)
services:
  prometheus:
    image: ${PROM_IMAGE:-prom/prometheus:v2.55.1}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/api_key:/etc/prometheus/api_key:ro
    ports: ["9090:9090"]
    restart: unless-stopped
  alertmanager:
    image: ${AM_IMAGE:-prom/alertmanager:v0.27.0}
    volumes: ["./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["9093:9093"]
    restart: unless-stopped
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.0}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    volumes: ["./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    restart: unless-stopped
